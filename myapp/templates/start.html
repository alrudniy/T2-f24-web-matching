<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
            margin: 0;
            position: relative; /* Ensure the body is the reference for absolute positioning */
            min-height: 100vh; /* Ensure the body takes at least the full viewport height */
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 20px;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            margin-top: 20px;
            text-align: left; /* Align text to the left inside the form */
        }

        form h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        .trademark {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: #333;
            font-size: 0.8em;
        }

        .back-button {
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }

        .back-button:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>Sup Jesse.</h1>
    <form action="{% url 'submit_credentials' %}" method="post">
        {% csrf_token %}
        <h2>Setup Questions</h2>
        <header>Please fill out your name -</header>
        <input type="text" name="name" placeholder="Enter your name">
        <br>
        <header>What genre of movie are you in the mood for?</header>
        <input type="text" name="genre" placeholder="Enter your preferred genre">
        <br>
        <header>Are you in the mood for animated or live action?</header>
        <input type="text" name="live/animated" placeholder="Animated or Live-Action">
        <br>
        <header>What is your favorite movie?</header>
        <input type="text" name="favorite" placeholder="Enter your favorite movie">
        <br>
        <button type="submit">Submit</button>
    </form>
    <button class="back-button" onclick="location.href='/'">Back</button>
    <div class="trademark">Theater B&trade;</div> <!-- Trademark message in the bottom right corner -->
</body>
</html>
