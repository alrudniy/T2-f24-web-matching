<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Promise Matching App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('https://excellerate.ca/wp-content/uploads/2014/10/Family-values-for-Jills-Blog-20171339_xxl-1024x434.jpg');
            background-size: cover;
            background-position: center top;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: rgba(76, 175, 80, 0.8); /* Green header with transparency */
            color: white;
            padding: 1em 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); /* Add shadow */
            position: relative; /* For positioning the logo */
        }
        .header h1 { margin: 0; } /* Remove default margin from h1 */
        .header .logo {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            max-width: 200px;
        }

        nav {
            background-color: #333;
            color: white;
            padding: 0.5em 0;
            text-align: center;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav li {
            display: inline-block;
            margin: 0 1em;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5em 1em;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #555;
        }

        .hero {
            /* background-image: url('https://excellerate.ca/wp-content/uploads/2014/10/Family-values-for-Jills-Blog-20171339_xxl-1024x434.jpg');  Replace with your hero image */
            /* background-size: cover; */
            /* background-position: center top; */
            height: 150px; /* Reduced height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: White;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Add text shadow */
        }

        .hero h2 {
            font-size: 2em;
            margin-bottom: 0.5em;
        }

        .content {
            padding: 2em;
            margin-top: -50px; /* Added top margin */
            flex: 1; /* Allow content to take up remaining space */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px; /* Spacing between buttons */
            margin-top: 2em;
        }

        .button {
            display: inline-block;
            padding: 1em 2em;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); /* Add button shadow */
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* Add smooth transition */
        }

        .button:hover {
            transform: translateY(-2px); /* Lift on hover */
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* Increase shadow on hover */
        }

        .button i { margin-right: 0.5em; }

        footer {
            background-color: rgba(51, 51, 51, 0.8); /* Dark footer with transparency */
            color: white; /* Ensure text is visible */
            text-align: center;
            padding: 1em 0;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Family Promise Matching App</h1>
        <img src="https://familypromise.org/wp-content/uploads/2021/03/FP-logo-horiz.png" alt="Family Promise Logo" class="logo">
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">FAQ</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h2>Welcome!</h2>
        <p>Find your perfect match.</p>
    </section>

    <div class="content">
        <p>Are you a tenant or a landlord?</p>
        <div class="buttons">
            <a href="{% url 'tenant_login' %}" class="button"><i class="fas fa-home"></i> I'm a Tenant</a>
            <a href="{% url 'landlord_login' %}" class="button"><i class="fas fa-building"></i> I'm a Landlord</a>
        </div>
    </div>

    <footer>
        &copy; 2024 Family Promise
    </footer>
</body>
</html>
