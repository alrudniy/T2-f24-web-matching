<!DOCTYPE html>
<html lang="en">
<head>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Promise Matching App</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        .title-bar {
            background-color: green;
            color: white;
            padding: 10px;
            text-align: center;
        }
        .title-bar img {
            vertical-align: right;
            width: 400px;
            height: 100px;
        }
        .center-content {
            text-align: center;
            margin-top: 20px;
        }
        .background-box {
            background-color: lightblue;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
        }
        .link-container {
            display: flex;
            justify-content: space-between;
            padding: 0 20%;
            margin-top: 20px;
        }
        .left-link-container, .right-link-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .link-box {
            display: inline-block;
            padding: 10px;
            border: 2px solid black;
            background-color: white;
            color: black;
            text-decoration: none;
            text-align: center;
            width: 150px;
        }
        .link-container img {
            display: block;
            margin: 0 auto 10px;
            width: 100px; /* Adjust the width as needed */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="title-bar">
        <h1>Welcome to the Family Promise Matching App!</h1>
    </div>
    <div class="title-bar">
        <img src="https://familypromise.org/wp-content/uploads/2021/03/FP-logo-horiz.png" alt="Family Promise Logo">
    </div>
    <div class="center-content">
        <div class="background-box">
            <h1>Lets Get Started!</h1>
            <h2>Are you a Tenant or a Landlord?</h2>
        </div>
    </div>
    <div class="link-container">
        <div class="left-link-container">
            <img src="https://img.freepik.com/premium-photo/keychain-with-tenant-word-image_698953-6488.jpg" alt="Tenant Image">
            <a href="{% url 'tenant_login' %}" class="link-box">I am a Tenant!</a>
        </div>
        <div class="right-link-container">
            <img src="https://img.freepik.com/premium-photo/keychain-with-landlord-word_698953-5228.jpg" alt="Landlord Image">
            <a href="{% url 'landlord_login' %}" class="link-box">I am a Landlord!</a>
        </div>
    </div>
</body>
</head>
</html>
