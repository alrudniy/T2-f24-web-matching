<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate House Features</title>
</head>
<body>
    <h1>Rate House Features</h1>
    <p>Please select a feature to rate:</p>
    
    <ul>
        {% for feature in features %}
            <li><a href="{% url 'rate_feature' feature %}">{{ feature }}</a></li>
        {% endfor %}
    </ul>

    <a href="{% url 'results' %}">See Results</a>
</body>
</html>
