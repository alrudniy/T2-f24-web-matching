<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Theater B</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
<style>

body {
    font-family: Arial, sans-serif;
    background-color: black;
    text-align: center;
    padding: 50px;
}

h1 {
    color: White;
    font-size: 2.5em;
    margin-bottom: 20px;
}

h2 {
    color: White;
    font-size: 1.5em;
    margin-bottom: 40px;
}

button {
    background-color: #4CAF50;
    color: white;
    padding: 20px 40px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 20px;
    margin: 20px 2px;
    cursor: pointer;
    border: none;
    border-radius: 4px;
}

button:hover {
    background-color: #45a049;
}


</style>
<body>
    <h1>Welcome to Movie Theater B!</h1>
    <h2>Select "Start" below to begin!</h2>
    <button onclick="location.href='/start'">Start!</button>
    <br><br>
</body>


</head>



</html>
