<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Movie Theater B</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: black;
            text-align: center;
            padding: 0;
            margin: 0;
            color: white;
        }

        header {
            background-color: red; /* Set background color to red */
            color: white;
            padding: 25px;
            font-size: 2em;
            width: 100%; /* Make the header fit the whole screen */
            box-sizing: border-box; /* Include padding in the element's total width and height */
        }

        nav {
            margin: 20px 0;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: White;
            font-size: 1.2em;
        }

        nav a:hover {
            color: #4CAF50;
        }

        .content {
            margin-top: 20px;
        }

        .movie {
            display: inline-block;
            width: 200px;
            margin: 20px;
            text-align: left;
            border: 3px solid #ccc; /* Add border around movie options */
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s; /* Add transition for hover effect */
        }

        .movie img {
            width: 100%;
            border-radius: 8px;
        }

        .movie h3 {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .movie p {
            font-size: 0.9em;
            color: white;
        }

        .movie:hover {
            transform: scale(1.05); /* Add hover effect */
        }

        .movie button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            margin-top: 10px;
        }

        .movie button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>Movie Theater B</header>
    <nav>
        <a href="/">Home</a>
        <a href="#">Now Showing</a>
        <a href="#">Coming Soon</a>
        <a href="#">Contact Us</a>
    </nav>
    <div class="content">
        <h1>Welcome to Movie Theater B!</h1>
        <p>Enjoy the latest movies in the comfort of your home.</p>
        <div class="movie">
            
            <h3>Movie Title 1</h3>
            <p>Short description of Movie 1.</p>
            <button onclick="location.href='#'">Watch Now</button>
        </div>
        <div class="movie">
            
            <h3>Movie Title 2</h3>
            <p>Short description of Movie 2.</p>
            <button onclick="location.href='#'">Watch Now</button>
        </div>
        <div class="movie">
            
            <h3>Movie Title 3</h3>
            <p>Short description of Movie 3.</p>
            <button onclick="location.href='#'">Watch Now</button>
        </div>
    </div>
</body>
</html>
