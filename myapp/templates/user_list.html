{% extends 'base.html' %}

{% block content %}
    <h1>All Users</h1>
    <table border="1">
        <thead>
            <tr>
                {% for key in users.0.keys %}
                    <th>{{ key|capfirst }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
                <tr>
                    {% for value in user.values %}
                        <td>{{ value }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
